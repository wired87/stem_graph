<section class="panel">
  <div class="panel__number">01</div>
  <div class="panel__body">
    <p class="eyebrow">ANATOMICAL CALIBRATION</p>
    <h2>Select tissue</h2>
    <div class="chips" id="tissue-chips">
      <button type="button" class="chip is-selected" data-value="Thalamus">Thalamus</button>
      <button type="button" class="chip" data-value="Hippocampus">Hippocampus</button>
      <button type="button" class="chip" data-value="Hypothalamus">Hypothalamus</button>
      <button type="button" class="chip" data-value="Cerebellum">Cerebellum</button>
      <button type="button" class="chip" data-value="Brain cortex">Brain cortex</button>
      <button type="button" class="chip" data-value="Brain">Whole brain</button>
    </div>
    <label class="field">
      <span>Custom tissue</span>
      <input id="custom-tissue" type="text" placeholder="e.g. skeletal muscle">
    </label>
  </div>
</section>
