<form id="protein-form" action="{% url 'protein_predictor:predict' %}" method="post"
      enctype="multipart/form-data" data-endpoint="{% url 'protein_predictor:predict' %}">
  {% csrf_token %}
  {% if form.errors %}<div class="error" role="alert">{{ form.errors }}</div>{% endif %}
  <input id="tissue" name="tissue" type="hidden" value="{{ form.tissue.value|default:'Thalamus' }}">
  {% include "protein/components/tissue_panel.html" %}
  {% include "protein/components/query_panel.html" %}
</form>
