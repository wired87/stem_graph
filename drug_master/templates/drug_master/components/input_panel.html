<section class="panel">
  <div class="panel__number">01</div>
  <div class="panel__body">
    <p class="eyebrow">PROTEIN INPUT</p>
    <h2>Define UniProt accessions</h2>
    <label class="field">
      <span>One accession per line or comma separated</span>
      <textarea id="accessions" name="accessions" rows="9"
                aria-describedby="accessions-help">{{ default_proteins }}</textarea>
      <small id="accessions-help">Accepted by the API as text or a JSON list; maximum 50 accessions.</small>
    </label>
    <label class="field">
      <span>Sex stratum (metadata only)</span>
      <select id="sex" name="sex">
        <option value="">Not supplied</option>
        <option value="female">Female</option>
        <option value="male">Male</option>
        <option value="intersex">Intersex</option>
      </select>
    </label>
  </div>
</section>
