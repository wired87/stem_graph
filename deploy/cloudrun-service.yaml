apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: stemgraph-web
  annotations:
    run.googleapis.com/launch-stage: GA
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "5"
        run.googleapis.com/cloudsql-instances: PROJECT_ID:REGION:INSTANCE_NAME
    spec:
      containerConcurrency: 20
      timeoutSeconds: 300
      containers:
        - image: REGION-docker.pkg.dev/PROJECT_ID/stemgraph/web:latest
          ports:
            - containerPort: 8080
          env:
            - name: POSTGRES_HOST
              value: /cloudsql/PROJECT_ID:REGION:INSTANCE_NAME
            - name: POSTGRES_DB
              value: stemgraph
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: stemgraph-db-user
                  key: latest
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: stemgraph-db-password
                  key: latest
            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: stemgraph-django-secret
                  key: latest
            - name: ALLOWED_HOSTS
              value: "*"
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /health/
              port: 8080
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /health/
              port: 8080
            periodSeconds: 30
